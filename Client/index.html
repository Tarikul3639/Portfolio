<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Meta Basics -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- SEO Optimization -->
    <title>Tarikul Islam | Full Stack Developer</title>
    <meta
      name="description"
      content="Portfolio of Tarikul Islam, a full stack developer skilled in React, Tailwind CSS, and MongoDB."
    />
    <meta
      name="keywords"
      content="Tarikul Islam, Full Stack Developer, React, Tailwind CSS, MongoDB, Portfolio, Bangladesh"
    />
    <meta name="author" content="Tarikul Islam" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://tarikul-islam.netlify.app/" />

    <!-- Progressive Web App Support -->
    <link rel="manifest" href="./public/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tarikul Islam Portfolio" />
    <meta name="theme-color" content="#111111" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="./public/tarikul-Islam.webp" />
    <link rel="apple-touch-icon" href="./public/tarikul-Islam.webp" />

    <!-- Open Graph for Social Sharing -->
    <meta property="og:title" content="Tarikul Islam | Full Stack Developer" />
    <meta
      property="og:description"
      content="Explore my portfolio built with React, Tailwind CSS, and MongoDB."
    />
    <meta property="og:image" content="./public/tarikul-Islam.webp" />
    <meta property="og:url" content="https://tarikul-islam.netlify.app/" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tarikul Islam | Full Stack Developer" />
    <meta
      name="twitter:description"
      content="Explore my portfolio built with React, Tailwind CSS, and MongoDB."
    />
    <meta name="twitter:image" content="./public/tarikul-Islam.webp" />

    <!-- Preconnect and DNS Prefetch -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://tarikul-islam.netlify.app" />

    <!-- Preloading Critical Assets -->
    <link rel="modulepreload" href="/src/main.jsx" />

    <!-- Structured Data with Schema.org -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Tarikul Islam",
        "url": "https://tarikul-islam.netlify.app",
        "image": "https://tarikul-islam.netlify.app/public/tarikul-Islam.webp",
        "jobTitle": "Full Stack Developer",
        "description": "Official portfolio of Tarikul Islam, a full stack developer skilled in React, Tailwind, and MongoDB. Based in Bangladesh.",
        "sameAs": [
          "https://github.com/tarikul-islam",
          "https://linkedin.com/in/tarikul-islam"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "email": "mailto:your-email@example.com",
          "contactType": "personal"
        }
      }
    </script>

    <!-- Content Security Policy -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' https://tarikul-islam.netlify.app data: blob:;
      media-src 'self' data: blob:;
      connect-src 'self' http://localhost:5000 https://*.netlify.app https://prod.spline.design https://fonts.gstatic.com https://cdn.jsdelivr.net;
      frame-src 'self';
      object-src 'none';
    "
    />
  </head>
  <body style="position: relative; overflow-x: hidden">
    <div id="root"></div>

    <!-- Main Application Entry Point -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
