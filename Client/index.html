<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./src/assets/image/Profile.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Tarikul Islam | Full Stack Developer</title>

    <!-- SEO Meta -->
    <meta name="description" content="Official portfolio of Tarikul Islam, a passionate full stack developer based in Bangladesh. Explore projects, skills, and experience.">

    <!-- Open Graph Meta -->
    <meta property="og:title" content="Tarikul Islam | Full Stack Developer" />
    <meta property="og:description" content="Explore my full stack web development portfolio with React, Tailwind CSS, MongoDB, and more." />
    <meta property="og:image" content="https://tarikul-islam.netlify.app/portfolio-preview.jpg" />
    <meta property="og:url" content="https://tarikul-islam.netlify.app/" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card Meta -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tarikul Islam | Full Stack Developer" />
    <meta name="twitter:description" content="Explore my full stack web development portfolio with React, Tailwind CSS, MongoDB, and more." />
    <meta name="twitter:image" content="https://tarikul-islam.netlify.app/portfolio-preview.jpg" />

    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Tarikul Islam",
        "url": "https://tarikul-islam.netlify.app",
        "image": "https://tarikul-islam.netlify.app/portfolio-preview.jpg",
        "jobTitle": "Full Stack Developer",
        "sameAs": [
          "https://github.com/tarikul-islam",
          "https://linkedin.com/in/tarikul-islam"
        ]
      }
    </script>

    <!-- Font Preconnect with proper CORS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />

    <!-- Optimized Font Loading -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@400;700&family=Poppins:wght@300;400;500&family=Source+Sans+3:wght@400&display=swap"
      media="print"
      onload="this.media='all'; this.onload=null"
      crossorigin="anonymous"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@400;700&family=Poppins:wght@300;400;500&family=Source+Sans+3:wght@400&display=swap"
        crossorigin="anonymous"
      />
    </noscript>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
